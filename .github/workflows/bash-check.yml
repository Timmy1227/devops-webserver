
name: Bash Syntax Check

on:
  push:
    branches:
      - main
      - feature/github-actions-ci
  pull_request:
    branches:
      - main

jobs:
  bash-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Bash syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script" || exit 1
          done
          echo "All Bash syntax checks passed!"


  pipeline-summary:
    needs: bash-syntax
    runs-on: ubuntu-latest

    steps:
      - name: Display pipeline summary
        run: |
          echo "Bash syntax validation completed successfully."
          echo "CI pipeline finished."


  deploy-simulation:
    needs: pipeline-summary
    runs-on: ubuntu-latest

    steps:
      - name: Simulate deployment
        run: |
          echo "Starting deployment simulation..."
          echo "CI checks passed successfully."
          echo "Deploying DevOps webserver..."
          echo "Deployment simulation completed!"


  deploy-staging:
    needs: deploy-simulation
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_ENV: ${{ vars.APP_ENV }}


    steps:
      - name: Deploy to staging
        run: |
          echo "Starting staging deployment..."
          echo "Deploying DevOps webserver to staging..."
          echo "Running staging checks..."
          echo "Staging deployment completed!"
          echo "Current deployment environment: $APP_ENV"

      - name: Verify staging secret
        env:
          STAGING_SECRET: ${{ secrets.DEMO_DEPLOY_TOKEN }}
        run: |
          if [ -n "$STAGING_SECRET" ]; then
            echo "Staging secret is configured."
          else
            echo "ERROR: Staging secret is missing."
            exit 1
          fi

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: ${{ vars.APP_ENV }}


    steps:
      - name: Deploy to production
        run: |
          echo "Starting production deployment..."
          echo "Staging checks completed successfully."
          echo "Deploying DevOps webserver to production..."
          echo "Production deployment completed!"
          echo "Testing the one-minute production wait timer."
          echo "Current deployment environment: $APP_ENV"
      - name: Verify staging secret isolation
        env:
          STAGING_SECRET: ${{ secrets.DEMO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$STAGING_SECRET" ]; then
            echo "PASS: Staging secret is not available in production."
          else
            echo "FAIL: Staging secret is accessible in production."
            exit 1
          fi
